    - Quick Start: getting-started/quick-start.md
    - Installation: deployment/installation.md
    - Configuration: deployment/configuration.md
  - Architecture:
    - High-Level Design: HLD_PostgreSQL_Blockchain_Extension.md
    - System Overview: architecture/index.md
    - Table Access Method: architecture/blockchain-access-method.md
    - Hash Chain System: architecture/hash-chain-system.md
    - Counter Management: architecture/counter-management.md
    - Immutability Enforcement: architecture/immutability-enforcement.md
  - API Reference:
    - API Overview: api/index.md
    - C API Reference: api/c-api-reference.md
    - SQL Functions: api/sql-functions-reference.md
    - System Catalogs: api/system-catalogs.md
  - User Guide:
    - User Guide Overview: user-guide/index.md
    - Creating Blockchain Tables: user-guide/creating-tables.md
    - Working with Data: user-guide/working-with-data.md
    - System Columns: user-guide/system-columns.md
    - Security Features: user-guide/security-features.md
    - Best Practices: user-guide/best-practices.md
  - Development:
    - Contributing: development/contributing.md
    - Development Setup: development/setup.md
    - Testing Guide: development/testing-guide.md
    - Debugging Guide: development/debugging.md
    - Performance Testing: development/performance-testing.md
  - Deployment:
    - Deployment Overview: deployment/index.md
    - Installation Guide: deployment/installation.md
    - Configuration: deployment/configuration.md
    - Migration Guide: deployment/migration.md
    - Monitoring: deployment/monitoring.md
    - Troubleshooting: deployment/troubleshooting.md
  - Examples:
    - Examples Overview: examples/index.md
    - Basic Usage: examples/basic-usage.md
    - Audit Logging: examples/audit-logging.md
    - Financial Records: examples/financial-records.md
    - Compliance Use Cases: examples/compliance.md
  - Reference:
    - Changelog: reference/changelog.md
    - FAQ: reference/faq.md
    - Glossary: reference/glossary.md
    - Performance Benchmarks: reference/performance.md

# Extra CSS and JavaScript
extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# Social links
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/your-org/apostgres
      name: GitHub Repository
    - icon: fontawesome/solid/paper-plane
      link: mailto:contact@example.com
      name: Contact Us
  version:
    provider: mike
    default: latest
  analytics:
    provider: google
    property: G-XXXXXXXXXX  # Replace with your Google Analytics ID
  generator: false

# Watch additional directories for changes
watch:
  - docs/
  - mkdocs.yml